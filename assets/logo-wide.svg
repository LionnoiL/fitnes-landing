<svg width="480" height="120" viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgWide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1333"/>
      <stop offset="100%" stop-color="#0d0a1a"/>
    </linearGradient>
    <linearGradient id="plateW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="barW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="collarW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect width="480" height="120" rx="20" fill="url(#bgWide)"/>

  <!-- ICON AREA (left, 120x120) -->
  <!-- Ambient glow -->
  <ellipse cx="60" cy="60" rx="54" ry="22" fill="#aa3bff" opacity="0.08"/>

  <!-- Left plate -->
  <rect x="10" y="34" width="18" height="52" rx="5" fill="url(#plateW)"/>
  <rect x="11" y="35" width="5" height="50" rx="2" fill="white" opacity="0.18"/>

  <!-- Left collar -->
  <rect x="27" y="46" width="7" height="28" rx="3" fill="url(#collarW)"/>

  <!-- Bar -->
  <rect x="33" y="51" width="54" height="18" rx="5" fill="url(#barW)"/>
  <rect x="33" y="51" width="54" height="6" rx="5" fill="white" opacity="0.12"/>

  <!-- Knurling -->
  <rect x="43" y="54" width="2" height="12" rx="1" fill="#7c3aed" opacity="0.5"/>
  <rect x="48" y="54" width="2" height="12" rx="1" fill="#7c3aed" opacity="0.5"/>
  <rect x="64" y="54" width="2" height="12" rx="1" fill="#7c3aed" opacity="0.5"/>
  <rect x="69" y="54" width="2" height="12" rx="1" fill="#7c3aed" opacity="0.5"/>

  <!-- Right collar -->
  <rect x="86" y="46" width="7" height="28" rx="3" fill="url(#collarW)"/>

  <!-- Right plate -->
  <rect x="92" y="34" width="18" height="52" rx="5" fill="url(#plateW)"/>
  <rect x="106" y="35" width="3" height="50" rx="1" fill="#5b21b6" opacity="0.4"/>

  <!-- Plate holes -->
  <circle cx="19" cy="60" r="5" fill="#180f2e"/>
  <circle cx="101" cy="60" r="5" fill="#180f2e"/>

  <!-- DIVIDER LINE -->
  <rect x="128" y="20" width="1" height="80" rx="1" fill="white" opacity="0.08"/>

  <!-- TEXT AREA -->
  <!-- FITNES main title -->
  <text x="148" y="71"
        font-family="system-ui, 'Segoe UI', Roboto, sans-serif"
        font-size="44"
        font-weight="700"
        letter-spacing="-1"
        fill="url(#textGrad)">FITNES</text>

  <!-- Subtitle -->
  <text x="150" y="95"
        font-family="system-ui, 'Segoe UI', Roboto, sans-serif"
        font-size="14"
        font-weight="400"
        letter-spacing="2.5"
        fill="#9d7ecf"
        text-anchor="start">СИСТЕМА ОБЛІКУ</text>
</svg>
