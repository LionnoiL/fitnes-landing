<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1333"/>
      <stop offset="100%" stop-color="#0d0a1a"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Left plate -->
  <rect x="6" y="21" width="12" height="22" rx="3" fill="url(#plate)"/>
  <!-- Left collar -->
  <rect x="17" y="26" width="4" height="12" rx="2" fill="#ddd6fe"/>
  <!-- Bar -->
  <rect x="20" y="29" width="24" height="6" rx="2" fill="url(#bar)"/>
  <!-- Right collar -->
  <rect x="43" y="26" width="4" height="12" rx="2" fill="#ddd6fe"/>
  <!-- Right plate -->
  <rect x="46" y="21" width="12" height="22" rx="3" fill="url(#plate)"/>

  <!-- Plate highlights -->
  <rect x="7" y="22" width="3" height="20" rx="1" fill="white" opacity="0.2"/>
  <rect x="57" y="22" width="3" height="20" rx="1" fill="#5b21b6" opacity="0.4"/>
</svg>
